name: Build and Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build all apps and prepare artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts
          for APP in api-gateway catalog-service inventory-service notification-service order-service payment-service; do
            echo "Building $APP"
            npm run build -- $APP
            ART_DIR=/tmp/artifacts/$APP
            rm -rf $ART_DIR
            mkdir -p $ART_DIR
            if [ -d "dist/apps/$APP" ]; then
              # copy contents of dist/apps/$APP into artifact dir to avoid nested folder
              cp -R dist/apps/$APP/. $ART_DIR/
            elif [ -d "dist/$APP" ]; then
              # copy contents of dist/$APP into artifact dir
              cp -R dist/$APP/. $ART_DIR/
            else
              echo "Could not find build output for $APP"
              exit 1
            fi
            cp -R node_modules $ART_DIR/ || true
            [ -f package.json ] && cp package.json $ART_DIR/ || true
            [ -f package-lock.json ] && cp package-lock.json $ART_DIR/ || true
            tar -C /tmp/artifacts -czf /tmp/$APP-artifact.tar.gz $APP
            echo "Prepared /tmp/$APP-artifact.tar.gz"
            # gh release create temp || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: /tmp/*-artifact.tar.gz

  deploy:
    name: Deploy apps to VPS
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api-gateway, catalog-service, inventory-service, notification-service, order-service, payment-service]
    steps:
      - name: Checkout (to get ecosystem.config.js)
        uses: actions/checkout@v4

      - name: Download artifact for ${{ matrix.app }}
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: /tmp/deploy

      - name: Extract artifact
        run: |
          mkdir -p /tmp/deploy/${{ matrix.app }}
          # Find the artifact tarball matching the current app
          ARTFILE=$(ls /tmp/deploy/*${{ matrix.app }}*-artifact.tar.gz 2>/dev/null | head -n1 || true)
          if [ -n "$ARTFILE" ] && [ -f "$ARTFILE" ]; then
            echo "Found artifact: $ARTFILE"
            tar -xzf "$ARTFILE" -C /tmp/deploy/${{ matrix.app }}
          else
            echo "Artifact for ${{ matrix.app }} not found in /tmp/deploy"
            echo "Listing /tmp/deploy for debug:" 
            ls -la /tmp/deploy || true
            exit 1
          fi

      - name: Rsync to VPS
        env:
          REMOTE_DIR: "${{ secrets.VPS_REMOTE_PATH }}/${{ matrix.app }}"
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y rsync
          mkdir -p /tmp/ssh
          echo "$VPS_SSH_PRIVATE_KEY" > /tmp/ssh/id_rsa
          chmod 600 /tmp/ssh/id_rsa
          export RSYNC_RSH="ssh -i /tmp/ssh/id_rsa -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT }}"
          rsync -avz --delete /tmp/deploy/${{ matrix.app }}/ ${VPS_USER}@${{ secrets.VPS_HOST }}:${REMOTE_DIR}/
          # sync ecosystem.config.js from repo root to remote base path
          if [ -f ecosystem.config.js ]; then
            rsync -avz ecosystem.config.js ${VPS_USER}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_REMOTE_PATH }}/ecosystem.config.js
          fi

      - name: Reload with pm2 on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_NAME="${{ matrix.app }}"
            ECOSYSTEM_REMOTE_PATH="${{ secrets.VPS_REMOTE_PATH }}/ecosystem.config.js"
            command -v pm2 >/dev/null 2>&1 || npm i -g pm2
            if pm2 list | grep -q "${APP_NAME}"; then
              pm2 reload "$ECOSYSTEM_REMOTE_PATH" --only "${APP_NAME}" --env production || pm2 start "$ECOSYSTEM_REMOTE_PATH" --only "${APP_NAME}" --env production
            else
              pm2 start "$ECOSYSTEM_REMOTE_PATH" --only "${APP_NAME}" --env production
            fi