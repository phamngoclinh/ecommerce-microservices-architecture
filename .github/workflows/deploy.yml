name: Build and Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-artifacts:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build all apps and prepare artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts

          for APP in api-gateway catalog-service inventory-service notification-service order-service payment-service; do
            echo "Building $APP"
            npm run build -- $APP
            echo "Done Building $APP"

            echo "Preparing /tmp/dist/apps/$APP-artifact.tar.gz"
            ART_DIR=/tmp/artifacts/dist/apps/$APP
            rm -rf $ART_DIR
            mkdir -p $ART_DIR
            # copy contents of dist/apps/$APP into artifact dir to avoid nested folder
            echo "Copy contents of dist/apps/$APP into artifact dir"
            cp -R dist/apps/$APP/. $ART_DIR/
            echo "Compress /tmp/artifacts/dist/apps/$APP into /tmp/dist/apps/$APP-artifact.tar.gz"
            mkdir -p /tmp/dist/apps
            tar -C /tmp/artifacts/dist/apps $APP -czf /tmp/dist/apps/$APP-artifact.tar.gz
            echo "Prepared /tmp/dist/apps/$APP-artifact.tar.gz"
          done

          echo "Preparing /tmp/common/common-artifact.tar.gz"
          mkdir -p /tmp/artifacts/common/common-artifacts
          cp -R node_modules /tmp/artifacts/common/common-artifacts || true
          [ -f package.json ] && cp package.json /tmp/artifacts/common/common-artifacts || true
          [ -f package-lock.json ] && cp package-lock.json /tmp/artifacts/common/common-artifacts || true
          echo "Compress /tmp/artifacts/common/common-artifacts into /tmp/common/common-artifact.tar.gz"
          mkdir -p /tmp/common
          tar -C /tmp/artifacts/common -czf /tmp/common/common-artifact.tar.gz common-artifacts
          echo "Prepared /tmp/common/common-artifact.tar.gz"

          # for APP in api-gateway catalog-service inventory-service notification-service order-service payment-service; do
          #   echo "Building $APP"
          #   npm run build -- $APP
          #   ART_DIR=/tmp/artifacts/$APP
          #   rm -rf $ART_DIR
          #   mkdir -p $ART_DIR
          #   if [ -d "dist/apps/$APP" ]; then
          #     # copy contents of dist/apps/$APP into artifact dir to avoid nested folder
          #     cp -R dist/apps/$APP/. $ART_DIR/
          #   elif [ -d "dist/$APP" ]; then
          #     # copy contents of dist/$APP into artifact dir
          #     cp -R dist/$APP/. $ART_DIR/
          #   else
          #     echo "Could not find build output for $APP"
          #     exit 1
          #   fi
          #   cp -R node_modules $ART_DIR/ || true
          #   [ -f package.json ] && cp package.json $ART_DIR/ || true
          #   [ -f package-lock.json ] && cp package-lock.json $ART_DIR/ || true
          #   tar -C /tmp/artifacts -czf /tmp/$APP-artifact.tar.gz $APP
          #   echo "Prepared /tmp/$APP-artifact.tar.gz"
          #   # gh release create temp || true
          # done

      - name: List prepared artifacts
        run: |
          echo "Listing artifact files in /tmp"
          ls -lah /tmp/**/*-artifact.tar.gz || true
          for f in /tmp/**/*-artifact.tar.gz; do
            if [ -f "$f" ]; then
              echo "== Contents of $f =="
              tar -tzf "$f" | sed -n '1,20p'
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            /tmp/dist/apps/*-artifact.tar.gz
            /tmp/common/*-artifact.tar.gz
  
  extract-artifacts:
    name: Extract All Artifacts
    needs: build-artifacts # Đảm bảo chạy sau khi build xong
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api-gateway, catalog-service, inventory-service, notification-service, order-service, payment-service]
    steps:
    - name: Download artifact for ${{ matrix.app }}
      uses: actions/download-artifact@v4
      with:
        name: artifacts
        path: /tmp/deploy

    - name: Extract artifact
      run: |
        mkdir -p /tmp/deploy

        # Find the artifact tarball matching the current app
        ARTFILE=$(ls /tmp/deploy/dist/apps/${{ matrix.app }}-artifact.tar.gz 2>/dev/null | head -n1 || true)
        if [ -n "$ARTFILE" ] && [ -f "$ARTFILE" ]; then
          echo "Found artifact: $ARTFILE"
          tar -xzf "$ARTFILE" -C /tmp/deploy/dist/apps
        else
          echo "Artifact for $ {{ matrix.app }} not found in /tmp/deploy"
          echo "Listing /tmp/deploy/dist/apps for debug:" 
          ls -la /tmp/deploy/dist/apps || true
          exit 1
        fi

        # Find the common artifact
        COMMON_ARTFILE=$(ls /tmp/deploy/common/common-artifact.tar.gz 2>/dev/null | head -n1 || true)
        if [ -n "$COMMON_ARTFILE" ] && [ -f "$COMMON_ARTFILE" ]; then
          echo "Found artifact: $COMMON_ARTFILE"
          tar -xzf "$COMMON_ARTFILE" -C /tmp/deploy/common
        else
          echo "Artifact for common not found in /tmp/deploy"
          echo "Listing /tmp/deploy/common for debug:" 
          ls -la /tmp/deploy/common || true
          exit 1
        fi
    
    # - name: Upload Extracted Files for Deployment
    #   # Upload TẤT CẢ các tệp đã giải nén vào một artifact mới
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: extracted-deployment-files
    #     path: /tmp/deploy_production
  
  deploy:
    name: Deploy apps to VPS
    needs: extract-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api-gateway, catalog-service, inventory-service, notification-service, order-service, payment-service]
    steps:
      - name: Checkout (to get ecosystem.config.js)
        uses: actions/checkout@v4

      # - name: Download extracted deployment files
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: extracted-deployment-files # 👈 Download artifact đã giải nén
      #     path: /tmp/deploy # Thư mục chứa các tệp đã giải nén

      - name: Rsync to VPS
        env:
          REMOTE_DIR: "${{ secrets.VPS_REMOTE_PATH }}"
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y rsync
          mkdir -p /tmp/ssh
          echo "$VPS_SSH_PRIVATE_KEY" > /tmp/ssh/id_rsa
          chmod 600 /tmp/ssh/id_rsa
          export RSYNC_RSH="ssh -i /tmp/ssh/id_rsa -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT }}"
          echo "rsync app ${{ matrix.app }}"
          rsync -avz --mkpath --delete /tmp/deploy/dist/apps/${{ matrix.app }}/ ${VPS_USER}@${{ secrets.VPS_HOST }}:${REMOTE_DIR}/dist/apps/${{ matrix.app }}
          echo "rsync common ${{ matrix.app }}"
          rsync -avz --delete /tmp/deploy/common/common-artifacts/ ${VPS_USER}@${{ secrets.VPS_HOST }}:${REMOTE_DIR}
          # sync ecosystem.config.js from repo root to remote base path
          if [ -f ecosystem.config.js ]; then
            rsync -avz ecosystem.config.js ${VPS_USER}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_REMOTE_PATH }}/ecosystem.config.js
          fi

      - name: Reload with pm2 on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            APP_NAME="${{ matrix.app }}"
            ECOSYSTEM_REMOTE_PATH="${{ secrets.VPS_REMOTE_PATH }}/ecosystem.config.js"
            command -v pm2 >/dev/null 2>&1 || npm i -g pm2
            if pm2 list | grep -q "${APP_NAME}"; then
              pm2 reload "$ECOSYSTEM_REMOTE_PATH" --only "${APP_NAME}" --env production || pm2 start "$ECOSYSTEM_REMOTE_PATH" --only "${APP_NAME}" --env production
            else
              pm2 start "$ECOSYSTEM_REMOTE_PATH" --only "${APP_NAME}" --env production
            fi