<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger n8n Webhook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Monaco', 'Courier New', monospace;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-trigger {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-trigger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-reset {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn-reset:hover {
            background: #e5e7eb;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #d1fae5;
            border: 2px solid #10b981;
            display: block;
        }
        
        .result.error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            display: block;
        }
        
        .result.loading {
            background: #dbeafe;
            border: 2px solid #3b82f6;
            display: block;
        }
        
        .result-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .result.success .result-title {
            color: #065f46;
        }
        
        .result.error .result-title {
            color: #991b1b;
        }
        
        .result.loading .result-title {
            color: #1e40af;
        }
        
        .result-content {
            font-size: 14px;
            line-height: 1.6;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        
        .result.success .result-content {
            color: #047857;
        }
        
        .result.error .result-content {
            color: #dc2626;
        }
        
        .result.loading .result-content {
            color: #2563eb;
        }
        
        .info-box {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .info-box p {
            color: #075985;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .info-box strong {
            color: #0c4a6e;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Trigger n8n Webhook</h1>
        <p class="subtitle">New Order Notification Workflow</p>
        
        <div class="info-box">
            <p><strong>Workflow:</strong> New Order Notification</p>
            <p><strong>Triggers:</strong> High-value order detection and email notifications</p>
        </div>
        
        <form id="webhookForm">
            <div class="form-group">
                <label for="webhookUrl">Webhook URL</label>
                <input 
                    type="text" 
                    id="webhookUrl" 
                    value="http://localhost:5678/webhook/order-created"
                    placeholder="http://localhost:5678/webhook/order-created"
                >
            </div>
            
            <div class="form-group">
                <label for="payload">Payload (JSON)</label>
                <textarea id="payload">{
  "orderId": "1",
  "orderTotal": 1500000,
  "country": "VN"
}</textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-trigger" id="triggerBtn">
                    Trigger Webhook
                </button>
                <button type="button" class="btn-reset" onclick="resetForm()">
                    Reset
                </button>
            </div>
        </form>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        const form = document.getElementById('webhookForm');
        const resultDiv = document.getElementById('result');
        const triggerBtn = document.getElementById('triggerBtn');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const webhookUrl = document.getElementById('webhookUrl').value;
            const payloadText = document.getElementById('payload').value;
            
            // Validate JSON
            let payload;
            try {
                payload = JSON.parse(payloadText);
            } catch (error) {
                showResult('error', 'Invalid JSON', error.message);
                return;
            }
            
            // Show loading
            showResult('loading', 'Triggering Webhook...', 'Sending request to n8n workflow...');
            triggerBtn.disabled = true;
            
            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                const responseData = await response.json();
                
                if (response.ok) {
                    showResult(
                        'success', 
                        '✓ Webhook Triggered Successfully!', 
                        `Status: ${response.status}\n\nResponse:\n${JSON.stringify(responseData, null, 2)}`
                    );
                } else {
                    showResult(
                        'error', 
                        'Webhook Failed', 
                        `Status: ${response.status}\n\nResponse:\n${JSON.stringify(responseData, null, 2)}`
                    );
                }
            } catch (error) {
                showResult(
                    'error', 
                    'Connection Error', 
                    `Could not connect to webhook:\n${error.message}\n\nMake sure n8n is running on the specified URL.`
                );
            } finally {
                triggerBtn.disabled = false;
            }
        });
        
        function showResult(type, title, content) {
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                ${type === 'loading' ? '<span class="spinner"></span>' : ''}
                <div class="result-title">${title}</div>
                <div class="result-content">${content}</div>
            `;
        }
        
        function resetForm() {
            document.getElementById('webhookUrl').value = 'http://localhost:5678/webhook/order-created';
            document.getElementById('payload').value = `{
  "orderId": "1",
  "orderTotal": 1500000,
  "country": "VN"
}`;
            resultDiv.className = 'result';
            resultDiv.innerHTML = '';
        }
    </script>
</body>
</html>
